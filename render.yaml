# =============================================================================
# QrID — description des services Render (Blueprint)
#
# POURQUOI CE FICHIER PLUTÔT QUE L'INTERFACE : la configuration d'un service
# créé à la souris ne vit que dans le compte Render. Personne ne peut la
# relire, la comparer, ni savoir qui a changé quoi. Ici, elle est dans le
# dépôt, versionnée, et relue comme du code.
#
# LES SECRETS N'Y SONT PAS. Les variables marquées `sync: false` sont saisies
# une fois dans l'interface de Render et n'apparaissent jamais dans Git.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # SERVICE WEB — l'application
  # ---------------------------------------------------------------------------
  - type: web
    name: qrid
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Frankfurt : le plus proche du Sénégal parmi les régions proposées.
    # La latence compte — une carte se scanne en réunion, pas au bureau.
    region: frankfurt

    plan: free
    branch: main

    # Render appelle cette adresse pour savoir si le conteneur est vivant.
    # La landing est publique et ne touche pas la base : c'est le bon choix.
    # Une page protégée renverrait 302 et Render la lirait comme un échec.
    healthCheckPath: /

    envVars:
      # --- Identité de l'application ---------------------------------------
      - key: APP_NAME
        value: QrID
      - key: APP_ENV
        value: production

      # JAMAIS true en production : une page d'erreur Laravel en mode debug
      # affiche les variables d'environnement, dont le mot de passe de la base.
      - key: APP_DEBUG
        value: false

      # Saisie à la main : Render fournit l'URL une fois le service créé, et
      # elle est GRAVÉE dans chaque QR Code généré.
      - key: APP_URL
        sync: false

      - key: APP_LOCALE
        value: fr
      - key: APP_FALLBACK_LOCALE
        value: fr

      # `php artisan key:generate --show` en local, puis coller la valeur.
      # Changer cette clé invalide toutes les sessions et rend illisible tout
      # ce qui a été chiffré avec l'ancienne.
      - key: APP_KEY
        sync: false

      # --- Base de données ---------------------------------------------------
      # MySQL managé externe : décision du 6 août 2026 (voir docs/DEPLOIEMENT.md).
      # Aucun portage PostgreSQL, donc aucune ligne de code applicatif touchée.
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

      # Contenu du fichier ca.pem d'Aiven, collé tel quel (plusieurs lignes,
      # de « -----BEGIN CERTIFICATE----- » à « -----END CERTIFICATE----- »).
      # L'entrypoint l'écrit dans un fichier et le passe à PDO.
      #
      # Aiven exige ssl-mode=REQUIRED et signe avec sa propre autorité : le
      # magasin du système ne peut pas la valider. Sans cette variable, la
      # connexion reste chiffrée mais l'identité du serveur n'est pas vérifiée.
      - key: DB_SSL_CA_CONTENT
        sync: false

      # --- Sessions, cache, file d'attente -----------------------------------
      # TOUT EN BASE, RIEN SUR LE DISQUE. Le disque du conteneur disparaît à
      # chaque déploiement : en `file`, chaque mise en ligne déconnecterait
      # l'ensemble des utilisateurs.
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: 1440
      - key: CACHE_STORE
        value: database

      # `sync` ENCORE — ET C'EST DÉLIBÉRÉ, MALGRÉ LE WORKER DÉCLARÉ PLUS BAS.
      #
      # ═══════════════════════════════════════════════════════════════════
      # L'ORDRE N'EST PAS NÉGOCIABLE, ET CE FICHIER LE RESPECTE
      # ═══════════════════════════════════════════════════════════════════
      # Le worker doit TOURNER avant que cette valeur passe à `database`.
      # L'inverse met les e-mails dans la table `jobs` sans que personne ne
      # les en sorte — et un e-mail de confirmation qui reste en file
      # signifie « plus personne ne peut créer de compte », sans aucune
      # erreur nulle part. C'est déjà arrivé sur ce produit.
      #
      # Or déclarer le worker ici ne le fait pas exister : il faut appliquer
      # le Blueprint, et sa création peut échouer — un plan payant demande un
      # moyen de paiement enregistré. Basculer les deux dans le même
      # déploiement, c'est parier que rien ne coince.
      #
      # LA MARCHE À SUIVRE, DANS CET ORDRE :
      #   1. appliquer ce Blueprint ; le worker est créé et démarre ;
      #   2. vérifier `php artisan app:health` — « Attente la plus longue »
      #      doit rester basse alors que des tâches passent ;
      #   3. alors seulement, passer cette valeur à `database`.
      #
      # Tant qu'on est en `sync`, le worker tourne à vide. Il coûte sans rien
      # faire pendant une journée : c'est le prix d'un basculement qu'on peut
      # observer avant de s'y fier.
      - key: QUEUE_CONNECTION
        value: sync

      # --- Stockage des fichiers ----------------------------------------------
      # `s3` — Cloudflare R2. Le disque du conteneur est ÉPHÉMÈRE : toute
      # image écrite dessus disparaît au déploiement suivant.
      #
      # Le contournement en place — les octets sont aussi écrits en base, le
      # disque n'est qu'un cache — fonctionne mais ne passe pas l'échelle :
      # ces octets voyagent dans chaque requête qui charge un profil.
      #
      # LES QUATRE VARIABLES CI-DESSOUS SONT REQUISES. Tant qu'elles ne sont
      # pas saisies dans l'interface de Render, laisser FILESYSTEM_DISK sur
      # `local` : un disque `s3` sans identifiants échoue à la première
      # écriture, et l'échec arrive au milieu d'une création de profil.
      - key: FILESYSTEM_DISK
        value: local
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_BUCKET
        sync: false
      # R2 : https://<compte>.r2.cloudflarestorage.com
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: true

      # --- Envoi des e-mails ---------------------------------------------------
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: QrID

      # --- Journaux --------------------------------------------------------------
      # `stderr` et non `single` : un journal écrit dans un fichier disparaît
      # avec le conteneur. Render collecte la sortie d'erreur.
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning

      # --- Marque ------------------------------------------------------------------
      # Imprimé sur la carte PVC, indépendamment de APP_URL.
      - key: BRAND_WEBSITE
        value: qrid.sn

  # ---------------------------------------------------------------------------
  # PAS DE SERVICE WORKER, PAS DE SERVICE CRON — ET C'EST UN CHOIX
  # ---------------------------------------------------------------------------
  #
  # Ce fichier declarait un worker `starter` pour la file d'attente, et
  # signalait plus bas qu'il manquait un service `cron` pour le
  # planificateur. Les deux exigent un plan payant, et aucun des deux n'a
  # jamais ete cree : le code etait ecrit, teste, et ne tournait pas.
  #
  # LES DEUX PROCESSUS VIVENT DESORMAIS DANS LE CONTENEUR WEB.
  #
  # `docker/supervisord.conf` en surveillait deja deux — nginx et php-fpm.
  # Il en surveille quatre : le planificateur (`schedule:work`) et la file
  # (`queue:work`) s'y ajoutent. supervisor les relance s'ils tombent, et
  # arrete tout s'il n'y parvient pas, ce qui fait remplacer le conteneur
  # par Render.
  #
  # CE QUE CELA COUTE : rien. CE QUE CELA NE REGLE PAS : le conteneur
  # s'endort apres quinze minutes sans visiteur sur le plan gratuit, et les
  # deux processus s'endorment avec lui.
  #
  # Pour le planificateur, ce n'etait pas tenable : `dailyAt('02:30')` ne
  # part que si on l'interroge pendant cette minute-la, et une nuit sans
  # visiteur la faisait SAUTER — sans erreur ni trace. Les taches demandent
  # donc maintenant « ai-je tourne aujourd'hui, et l'heure est-elle
  # passee ? ». Voir `App\Support\Planificateur`. Un conteneur endormi les
  # retarde ; il ne les saute plus.
  #
  # QUAND REVENIR A UN SERVICE SEPARE : le jour ou un traitement lourd
  # concurrencera les requetes web sur le meme demi-processeur. On le verra
  # aux temps de reponse, pas en le supposant. Le bloc supprime ici est dans
  # l'historique Git, pret a etre repris.
  #
  # LE RESTE DU CHEMIN, POUR MEMOIRE :
  #   · le reveil a froid des cartes publiques subsiste. Aucune astuce
  #     interne ne le corrige : il faut du trafic venu de l'exterieur, donc
  #     un service de ping gratuit ou le plan payant.
  #   · QUEUE_CONNECTION vaut encore `sync`. Le worker tourne a vide,
  #     volontairement : il doit etre OBSERVE avant qu'on lui confie les
  #     e-mails. Basculer d'abord et esperer ensuite, c'est la panne deja
  #     vecue sur ce produit.

# =============================================================================
# LE GROUPE DE VARIABLES PARTAGÉES
# =============================================================================
# Il n'existe pas encore : les variables sont déclarées service par service.
# Le jour où le worker est créé, il faut soit créer ce groupe dans
# l'interface de Render et y déplacer les variables communes, soit recopier
# le bloc `envVars` du service web ci-dessus.
#
# Recopier fonctionne et ne coûte rien aujourd'hui. Le groupe devient
# nécessaire au troisième service.
# =============================================================================

# =============================================================================
# CE QUI N'EST PAS ENCORE ICI, ET POURQUOI
# =============================================================================
#
# UN SERVICE « CRON » pour le planificateur.
#   routes/console.php déclare deux tâches (purge des inscriptions expirées,
#   surveillance de la file). Un service web ne les exécute pas.
#   À ajouter quand le budget le permet :
#
#     - type: cron
#       name: qrid-scheduler
#       runtime: docker
#       dockerfilePath: ./Dockerfile
#       schedule: "* * * * *"
#       dockerCommand: php artisan schedule:run
#       envVars:
#         - fromGroup: qrid-env
#
#   Tant qu'il n'existe pas, les inscriptions abandonnées s'accumulent en base.
#   Ce n'est pas bloquant, mais il faut le savoir.
#
# UN SERVICE « WORKER » pour la file d'attente.
#   Inutile tant que QUEUE_CONNECTION vaut `sync`. Le jour où on le crée, il
#   faut basculer la variable — l'oublier arrêterait tous les e-mails sans
#   aucun message d'erreur.
#
# UN DISQUE PERSISTANT.
#   Alternative au stockage objet pour les photos. Une ligne suffit, mais
#   c'est payant et cela lie les fichiers à Render.
#
# LA BASE DE DONNÉES.
#   Volontairement absente : elle est chez un hébergeur MySQL externe, hors
#   de ce Blueprint. Render ne propose pas de MySQL managé.
