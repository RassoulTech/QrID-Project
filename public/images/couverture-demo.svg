<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720"
     role="img" aria-label="Illustration de couverture">
  <!--
    LA COUVERTURE DE LA MAQUETTE — dessinée, comme le portrait qu'elle remplace.

    Elle est passée à x-couverture SOUS FORME D'ADRESSE, exactement comme la
    photo qu'un porteur téléverse. La maquette emprunte donc le même chemin de
    rendu que la vraie page : <img class="pubc__couverture-image"> avec le
    recadrage et le voile identiques. Aucune branche d'affichage propre à la
    vitrine, donc aucune divergence possible.

    POURQUOI UN DESSIN. La landing montrait la photo du propriétaire du
    compte : le visiteur croyait voir un client, et le propriétaire se
    retrouvait sur la vitrine de son propre produit. Une photographie de
    banque d'images poserait les mêmes problèmes en pire — quelqu'un de réel,
    une licence, et une requête réseau sur une 3G.

    LE SUJET EST À DROITE. Le nom, la fonction et l'entreprise sont posés en
    BAS À GAUCHE de la couverture par x-couverture. Un sujet centré aurait le
    visage barré par le patronyme.

    Format 4:3, comme la bande de 280px de haut sur un écran de 375px.
    object-fit:cover recadre au centre : rien d'essentiel ne touche les bords.
  -->
  <defs>
    <linearGradient id="cd-fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E9E7A"/>
      <stop offset="55%" stop-color="#0F5040"/>
      <stop offset="100%" stop-color="#06251C"/>
    </linearGradient>

    <radialGradient id="cd-halo" cx="0.72" cy="0.32" r="0.55">
      <stop offset="0%" stop-color="#6FD3B7" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#6FD3B7" stop-opacity="0"/>
    </radialGradient>

    <!-- L'écho du QR Code : une trame de modules carrés, très discrète.
         Elle casse la platitude de l'aplat sans dessiner de forme qu'on
         chercherait à reconnaître. -->
    <pattern id="cd-trame" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" x="0" y="0" fill="#FFFFFF" opacity=".05"/>
      <rect width="12" height="12" x="30" y="28" fill="#FFFFFF" opacity=".04"/>
    </pattern>

    <clipPath id="cd-cadre">
      <rect width="960" height="720"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cd-cadre)">
    <rect width="960" height="720" fill="url(#cd-fond)"/>
    <rect width="960" height="720" fill="url(#cd-trame)"/>
    <rect width="960" height="720" fill="url(#cd-halo)"/>

    <!-- LE SUJET. Même palette et même parti pris que x-avatar-demo : un
         buste, un cou, une tête, une chevelure — et AUCUN trait de visage.
         Des yeux et une bouche feraient un personnage, et un personnage
         finit par ressembler à quelqu'un. -->
    <g transform="translate(624 176) scale(3.05)">
      <!-- Le buste : la chemise, qui déborde volontairement du bas. -->
      <path d="M50 66c-22 0-39 14-43 34v40h86v-40c-4-20-21-34-43-34z" fill="#F4F6F5"/>

      <!-- Le col ouvert : sans lui, le buste est une masse, pas un vêtement. -->
      <path d="M41 68l9 11 9-11-4-2-5 6-5-6z" fill="#0B3B2E" opacity=".22"/>

      <!-- Le cou, qui rattache le visage aux épaules. -->
      <path d="M42 52h16v14H42z" fill="#C69A72"/>

      <!-- La tête. -->
      <circle cx="50" cy="41" r="21" fill="#E0B48C"/>

      <!-- La chevelure, en calotte, débordant sur les tempes. -->
      <path d="M29 42a21 21 0 0 1 42 0c1-7-2-12-7-15-4-3-9-4-14-4s-10 1-14 4c-5 3-8 8-7 15z"
            fill="#2B1B12"/>
      <path d="M27 44c-1-4 0-7 2-8 1 4 1 7 0 9zM71 44c1-4 0-7-2-8-1 4-1 7 0 9z"
            fill="#2B1B12"/>
    </g>

    <!-- Une ombre douce au pied du sujet : elle le pose sur le fond au lieu
         de le laisser flotter. -->
    <ellipse cx="780" cy="716" rx="240" ry="46" fill="#06251C" opacity=".28"/>
  </g>
</svg>
