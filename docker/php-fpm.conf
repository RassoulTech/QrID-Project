; =============================================================================
; php-fpm — QrID
;
; UNE SEULE DIRECTIVE, ET ELLE ÉVITE LA PANNE LA PLUS DÉROUTANTE QUI SOIT.
;
; php-fpm efface par défaut l'environnement de ses processus enfants
; (`clear_env = yes`). Avec ce réglage, AUCUNE variable définie dans Render
; n'atteindrait PHP : ni APP_KEY, ni DB_HOST, ni les identifiants de la base.
;
; Le symptôme serait particulièrement trompeur :
;
;   · l'entrypoint tourne, LUI, dans un shell normal. Ses vérifications
;     passeraient, les migrations s'exécuteraient, les caches se
;     construiraient — tout paraîtrait parfait dans les journaux ;
;   · puis la première requête HTTP arriverait sur un PHP sans APP_KEY et
;     sans base de données, et échouerait sans rapport apparent avec la
;     configuration.
;
; L'image officielle php:fpm pose déjà `clear_env = no` dans son propre
; docker.conf. On ne s'appuie pas sur cette mémoire : ce fichier est chargé
; APRÈS (l'ordre est alphabétique, d'où le préfixe « zzz ») et tranche la
; question définitivement.
; =============================================================================

[www]
clear_env = no

; Les sorties des workers rejoignent le journal principal, donc les flux du
; conteneur, donc Render. Sans cela, un `error_log()` de PHP se perdrait.
catch_workers_output = yes
decorate_workers_output = no

; --- Dimensionnement ----------------------------------------------------------
; Le plan gratuit de Render offre peu de mémoire. Avec memory_limit à 256 Mo,
; cinq workers suffisent largement et évitent qu'un pic de trafic ne fasse
; tuer le conteneur pour dépassement mémoire.
pm = dynamic
; MOINS D'ENFANTS, POUR FAIRE DE LA PLACE AU PLANIFICATEUR
;
; L'instance dispose de 512 Mo et d'un dixième de processeur. Cinq enfants
; php-fpm à ~80 Mo en usage réel occupaient déjà 400 Mo — et supervisor fait
; désormais tourner deux processus de plus : le planificateur et la file.
;
; Trois enfants ne bride rien à ce niveau de puissance : sur 0,1 processeur,
; le goulot est le calcul, pas le nombre de places. Au-delà de trois requêtes
; simultanées, elles attendaient déjà leur tour dans le processeur plutôt que
; d'être servies en parallèle. Les requêtes excédentaires patientent dans
; nginx, ce qui vaut mieux qu'un conteneur tué pour dépassement de mémoire.
pm.max_children = 3
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 2

; Un worker est recyclé après 500 requêtes : c'est le filet contre une fuite
; de mémoire lente, dans le code comme dans une dépendance.
pm.max_requests = 500
