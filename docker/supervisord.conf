; =============================================================================
; supervisord — QrID
;
; POURQUOI CE FICHIER EXISTE : un conteneur ne fait tourner qu'UN processus.
; Quand celui-ci s'arrête, le conteneur s'arrête. Or il en faut deux :
;
;   nginx    reçoit les requêtes HTTP et sert les fichiers statiques
;   php-fpm  exécute le PHP
;
; Une solution répandue consiste à lancer php-fpm en arrière-plan depuis un
; script, puis nginx au premier plan. Elle a un défaut sérieux : si php-fpm
; meurt, le conteneur continue de tourner et nginx répond 502 à tout le monde.
; Render, lui, voit un conteneur vivant et ne redémarre rien.
;
; Supervisor surveille les deux. Si l'un tombe, il le relance ; s'il n'y
; parvient pas, il arrête tout — et Render remplace le conteneur.
; =============================================================================

[supervisord]
; Au premier plan : c'est LUI le processus principal du conteneur.
nodaemon = true
user     = root
logfile  = /dev/null
logfile_maxbytes = 0
pidfile  = /tmp/supervisord.pid

[program:php-fpm]
command  = php-fpm --nodaemonize
autostart    = true
autorestart  = true
startretries = 3
priority     = 10

; Les journaux partent sur les flux du conteneur, jamais dans un fichier :
; un fichier disparaîtrait avec le conteneur, et Render ne le verrait pas.
stdout_logfile         = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile         = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
; `daemon off` maintient nginx au premier plan : sans cela, il se met en
; arrière-plan, supervisor le croit terminé et le relance en boucle.
command  = nginx -g "daemon off;"
autostart    = true
autorestart  = true
startretries = 3
; Démarré APRÈS php-fpm : une priorité plus élevée passe en second. Sinon les
; toutes premières requêtes tombent en 502, le temps que php-fpm soit prêt.
priority     = 20

stdout_logfile         = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile         = /dev/stderr
stderr_logfile_maxbytes = 0

; =============================================================================
; LE PLANIFICATEUR — les tâches quotidiennes, sans service payant
; =============================================================================
;
; POURQUOI IL EST ICI ET NON DANS UN SERVICE RENDER SÉPARÉ : un service cron
; ou un worker Render exige un plan payant. supervisor, lui, est déjà là et
; surveille déjà deux processus ; le troisième ne coûte rien de plus.
;
; `schedule:work` appelle le planificateur chaque minute, indéfiniment. C'est
; l'équivalent exact d'une ligne de crontab, à ceci près qu'il vit dans le
; conteneur.
;
; ═══════════════════════════════════════════════════════════════════════════
; CE QU'IL NE PEUT PAS FAIRE, ET COMMENT ON LE CONTOURNE
; ═══════════════════════════════════════════════════════════════════════════
; Render endort le conteneur quand plus personne ne visite le site. Le
; planificateur s'endort avec lui : une tâche prévue à 02:30 ne verrait jamais
; sa minute passer.
;
; C'est pourquoi les tâches ne demandent plus « quelle minute est-il ? » mais
; « ai-je tourné aujourd'hui, et l'heure est-elle passée ? » — voir
; App\Support\Planificateur. Un conteneur endormi les RETARDE ; il ne les
; saute plus.
;
; www-data et non root : les fichiers que ces processus écrivent doivent
; rester lisibles par php-fpm, qui tourne sous cet utilisateur.
;
; HOME EST RÉÉCRIT, ET C'EST CE QUI REND NEON JOIGNABLE (13 octobre 2026).
; `user = www-data` change l'utilisateur mais PAS l'environnement : le
; processus héritait de HOME=/root. Or libpq — le client PostgreSQL — cherche
; un certificat client dans $HOME/.postgresql/ ; www-data n'a pas le droit
; de lire /root, et libpq traite ce refus comme une erreur fatale :
;
;   could not open certificate file "/root/.postgresql/postgresql.crt":
;   Permission denied
;
; Le site répondait — php-fpm, lui, donne à ses processus le HOME de
; www-data — mais le planificateur ne joignait plus la base : ni agrégation,
; ni relances, ni récapitulatif, ni sauvegarde. MySQL ne faisait jamais
; cette recherche, d'où un défaut resté invisible jusqu'à la bascule.
[program:planificateur]
command  = php /var/www/artisan schedule:work
user     = www-data
directory = /var/www
environment = HOME="/var/www",USER="www-data"
autostart    = true
autorestart  = true
startretries = 3
priority     = 30

; ─────────────────────────────────────────────────────────────────────────────
; ARRETER LE GROUPE, PAS UN PID ISOLE
; ─────────────────────────────────────────────────────────────────────────────
; A l'arret du conteneur, supervisor a echoue a tuer ces deux programmes :
;
;   CRIT unknown problem killing planificateur (57)
;   PermissionError: [Errno 1] Operation not permitted
;
; nginx et php-fpm, eux, s'arretent proprement. La difference tient a ce que
; ces deux-la FORKENT : `schedule:work` lance un `schedule:run` chaque minute,
; et `queue:work` peut avoir une tache en cours. Supervisor ne connait que le
; pid du parent qu'il a lance ; il signale ce seul pid, et les enfants lui
; echappent.
;
; `stopasgroup` et `killasgroup` envoient le signal au GROUPE de processus.
; C'est la pratique documentee par Laravel pour queue:work, et c'est ce qui
; permet a une tache en cours de recevoir son SIGTERM et de finir proprement
; au lieu d'etre orpheline puis coupee net par Docker.
;
; La portee du defaut est limitee : il ne survenait qu'a l'arret, jamais en
; fonctionnement. Mais un e-mail coupe au milieu de son envoi, c'est un
; e-mail qui n'arrive pas — et personne pour le dire.
stopasgroup  = true
killasgroup  = true

stdout_logfile         = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile         = /dev/stderr
stderr_logfile_maxbytes = 0

; =============================================================================
; LA FILE D'ATTENTE — présente, vérifiable, pas encore utilisée
; =============================================================================
;
; ⚠ L'ORDRE DE BASCULE N'EST PAS NÉGOCIABLE.
;
; QUEUE_CONNECTION vaut encore `sync` : les e-mails partent dans la requête
; HTTP, et rien n'arrive dans la table `jobs`. Ce processus tourne donc à
; vide — et c'est exactement ce qu'on veut pour l'instant.
;
; Il est là pour être OBSERVÉ avant qu'on lui confie quoi que ce soit. Faire
; l'inverse — basculer la variable en espérant que le worker démarre — mettrait
; les e-mails en file sans que personne ne les en sorte. Un e-mail de
; confirmation qui reste en file signifie « plus personne ne peut créer de
; compte », sans aucune erreur nulle part. C'est déjà arrivé sur ce produit.
;
; `database` est écrit EXPLICITEMENT et non laissé au défaut : le défaut vaut
; `sync`, et `queue:work sync` n'a pas de sens. Nommer la connexion permet au
; worker de vider la table pendant que l'application, elle, envoie encore en
; direct.
;
; --sleep=10 : la table est vide, il est inutile de l'interroger toutes les
; trois secondes. Dix secondes font six requêtes par minute au lieu de vingt,
; sur une base MySQL distante qu'on partage avec l'application.
;
; --max-time=3600 : le processus se termine de lui-même toutes les heures et
; supervisor le relance. C'est le remède le plus simple aux fuites mémoire
; d'un processus PHP de longue durée.
;
; TANT QUE QUEUE_CONNECTION VAUT `sync`, LE WORKER DORT (12 octobre 2026).
;
; Même à vide, il interrogeait la base toutes les dix secondes — la table
; `jobs`, puis le signal de redémarrage rangé dans le cache, lui aussi en
; base. Neon n'endort la base qu'après cinq minutes SANS AUCUNE requête : ce
; seul processus la tenait éveillée tant que le conteneur l'était, et chaque
; heure éveillée se décompte des 100 heures de calcul gratuites.
;
; Or en `sync`, rien n'entre jamais dans `jobs` : il n'y avait rien à
; observer, seulement un processus qui tourne. Le jour où la variable passe à
; `database`, Render redémarre le conteneur et le worker démarre DANS LE MÊME
; DÉPLOIEMENT que la bascule — la panne « en file sans personne pour vider »
; ne peut plus se produire. Reste à vérifier, dans l'heure qui suit, que
; « Attente la plus longue » reste basse sur l'écran État système.
[program:file]
command  = /bin/sh -c 'if [ "${QUEUE_CONNECTION:-sync}" = "sync" ]; then echo "file : QUEUE_CONNECTION=sync, rien a consommer, le worker dort"; exec sleep 2147483647; fi; exec php /var/www/artisan queue:work database --queue=mail,default,low --tries=3 --backoff=10,60,300 --timeout=120 --max-time=3600 --sleep=10'
user     = www-data
directory = /var/www
; Même raison que pour le planificateur : sans lui, libpq cherche un
; certificat dans /root et refuse la connexion à Neon.
environment = HOME="/var/www",USER="www-data"
autostart    = true
autorestart  = true
startretries = 3
priority     = 40

; Le temps de finir la tâche en cours avant d'être arrêté. Sans ce délai, un
; e-mail en cours d'envoi serait interrompu au milieu.
stopsignal   = TERM
stopwaitsecs = 30

; ─────────────────────────────────────────────────────────────────────────────
; ARRETER LE GROUPE, PAS UN PID ISOLE
; ─────────────────────────────────────────────────────────────────────────────
; A l'arret du conteneur, supervisor a echoue a tuer ces deux programmes :
;
;   CRIT unknown problem killing planificateur (57)
;   PermissionError: [Errno 1] Operation not permitted
;
; nginx et php-fpm, eux, s'arretent proprement. La difference tient a ce que
; ces deux-la FORKENT : `schedule:work` lance un `schedule:run` chaque minute,
; et `queue:work` peut avoir une tache en cours. Supervisor ne connait que le
; pid du parent qu'il a lance ; il signale ce seul pid, et les enfants lui
; echappent.
;
; `stopasgroup` et `killasgroup` envoient le signal au GROUPE de processus.
; C'est la pratique documentee par Laravel pour queue:work, et c'est ce qui
; permet a une tache en cours de recevoir son SIGTERM et de finir proprement
; au lieu d'etre orpheline puis coupee net par Docker.
;
; La portee du defaut est limitee : il ne survenait qu'a l'arret, jamais en
; fonctionnement. Mais un e-mail coupe au milieu de son envoi, c'est un
; e-mail qui n'arrive pas — et personne pour le dire.
stopasgroup  = true
killasgroup  = true

stdout_logfile         = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile         = /dev/stderr
stderr_logfile_maxbytes = 0
