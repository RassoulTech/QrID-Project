; =============================================================================
; supervisord — QrID
;
; POURQUOI CE FICHIER EXISTE : un conteneur ne fait tourner qu'UN processus.
; Quand celui-ci s'arrête, le conteneur s'arrête. Or il en faut deux :
;
;   nginx    reçoit les requêtes HTTP et sert les fichiers statiques
;   php-fpm  exécute le PHP
;
; Une solution répandue consiste à lancer php-fpm en arrière-plan depuis un
; script, puis nginx au premier plan. Elle a un défaut sérieux : si php-fpm
; meurt, le conteneur continue de tourner et nginx répond 502 à tout le monde.
; Render, lui, voit un conteneur vivant et ne redémarre rien.
;
; Supervisor surveille les deux. Si l'un tombe, il le relance ; s'il n'y
; parvient pas, il arrête tout — et Render remplace le conteneur.
; =============================================================================

[supervisord]
; Au premier plan : c'est LUI le processus principal du conteneur.
nodaemon = true
user     = root
logfile  = /dev/null
logfile_maxbytes = 0
pidfile  = /tmp/supervisord.pid

[program:php-fpm]
command  = php-fpm --nodaemonize
autostart    = true
autorestart  = true
startretries = 3
priority     = 10

; Les journaux partent sur les flux du conteneur, jamais dans un fichier :
; un fichier disparaîtrait avec le conteneur, et Render ne le verrait pas.
stdout_logfile         = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile         = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
; `daemon off` maintient nginx au premier plan : sans cela, il se met en
; arrière-plan, supervisor le croit terminé et le relance en boucle.
command  = nginx -g "daemon off;"
autostart    = true
autorestart  = true
startretries = 3
; Démarré APRÈS php-fpm : une priorité plus élevée passe en second. Sinon les
; toutes premières requêtes tombent en 502, le temps que php-fpm soit prêt.
priority     = 20

stdout_logfile         = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile         = /dev/stderr
stderr_logfile_maxbytes = 0
