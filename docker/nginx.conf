# =============================================================================
# nginx — QrID
#
# CE FICHIER EST UN GABARIT, pas une configuration finale. L'entrypoint le fait
# passer par `envsubst` au démarrage pour y injecter ${PORT}.
#
# POURQUOI : Render impose le port d'écoute par la variable d'environnement
# PORT, et il change. Or nginx ne lit pas les variables d'environnement dans sa
# configuration — écrire `listen 80;` en dur donnerait un conteneur qui démarre
# parfaitement, que Render déclarerait « unhealthy » sans plus d'explication.
# C'est l'erreur la plus fréquente d'un premier déploiement.
# =============================================================================

user  www-data;

# `auto` suit le nombre de cœurs alloués au conteneur. Sur le plan gratuit,
# cela vaut 1 — inutile d'en réclamer davantage.
worker_processes  auto;

# Les journaux partent sur la sortie standard et la sortie d'erreur, pas dans
# un fichier. Un conteneur est jetable : un journal écrit sur son disque
# disparaît avec lui. Render collecte ces deux flux.
error_log  /dev/stderr  warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /dev/stdout;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout  65;

    # Le nom du serveur n'est pas annoncé dans les en-têtes : une version de
    # nginx affichée est une indication offerte à qui cherche une faille connue.
    server_tokens  off;

    # Compression. Elle compte : la feuille de style fait environ 300 Ko, et
    # une partie des visiteurs arrivent en 3G depuis un scan de QR Code.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      image/svg+xml;

    # Doit rester AU-DESSUS de la limite Laravel (2 Mo sur le champ `photo`).
    # Si nginx refusait au seuil métier, le client verrait une page 413 brute
    # en anglais au lieu du message français sous son champ. Voir le
    # commentaire détaillé dans docker/php.ini.
    client_max_body_size  8M;

    server {
        listen  ${PORT};

        # LA RACINE EST public/, JAMAIS LA RACINE DU PROJET. Servir /var/www
        # exposerait .env, vendor/, storage/ et le code source complet.
        root   /var/www/public;
        index  index.php;

        charset  utf-8;

        # --- Sécurité ---------------------------------------------------------
        add_header X-Content-Type-Options  "nosniff"        always;
        add_header X-Frame-Options         "SAMEORIGIN"     always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

        # --- Le routage Laravel -----------------------------------------------
        # On sert le fichier s'il existe, le dossier sinon, et l'on retombe sur
        # index.php pour tout le reste — c'est lui qui tient le routeur.
        location / {
            try_files  $uri $uri/ /index.php?$query_string;
        }

        # --- Assets versionnés -------------------------------------------------
        # Vite met une empreinte dans chaque nom de fichier (app-BmouMjNs.css).
        # Un contenu modifié change de nom : on peut donc les garder un an sans
        # aucun risque de servir une version périmée.
        location ^~ /build/ {
            expires    1y;
            access_log off;
            add_header Cache-Control "public, immutable";
            try_files  $uri =404;
        }

        # Les photos et QR Codes n'ont PAS d'empreinte : leur nom ne change pas
        # quand le client remplace sa photo. Une semaine, pas un an.
        location ^~ /storage/ {
            expires    7d;
            access_log off;
            add_header Cache-Control "public";
            try_files  $uri =404;
        }

        # --- PHP ----------------------------------------------------------------
        location ~ \.php$ {
            # Refuse les chemins du type /image.png/faux.php : sans cette ligne,
            # un fichier téléversé pourrait être interprété comme du code.
            fastcgi_split_path_info  ^(.+\.php)(/.+)$;

            fastcgi_pass    127.0.0.1:9000;
            fastcgi_index   index.php;
            include         fastcgi_params;

            fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
            fastcgi_param  PATH_INFO        $fastcgi_path_info;

            # La génération d'un PDF imprimable prend plusieurs secondes.
            fastcgi_read_timeout  120;

            fastcgi_buffers      16 16k;
            fastcgi_buffer_size  32k;
        }

        # Aucun accès aux fichiers cachés — .env, .git — ni aux journaux.
        location ~ /\.(?!well-known).* {
            deny  all;
        }
    }
}
