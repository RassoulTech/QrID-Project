; =============================================================================
; PHP — réglages de production pour QrID
;
; L'image officielle ne fournit aucun php.ini par défaut : sans ce fichier,
; PHP tourne avec ses valeurs de repli, pensées pour le développement.
; =============================================================================

; --- Ce qui est montré à l'utilisateur ---------------------------------------
; JAMAIS d'erreur affichée dans la page. Une trace d'exécution PHP expose les
; chemins du serveur, les identifiants de connexion et parfois le contenu des
; variables. Les erreurs partent dans le journal, que Render collecte.
display_errors        = Off
display_startup_errors = Off
log_errors            = On
error_log             = /dev/stderr
error_reporting       = E_ALL & ~E_DEPRECATED & ~E_STRICT

; La version de PHP n'est pas annoncée dans les en-têtes HTTP.
expose_php            = Off

; --- Téléversement des photos -------------------------------------------------
; TROIS LIMITES EN CASCADE, et leur ordre décide de la qualité du message
; d'erreur que verra le client :
;
;   nginx  client_max_body_size  8M   ← rejette le plus gros, brutalement (413)
;   PHP    upload_max_filesize   8M
;   Laravel  'photo' => max:2048       ← 2 Mo, la vraie règle métier
;
; Les deux premières doivent rester AU-DESSUS de la troisième. Si nginx
; refusait à 2 Mo, un fichier de 2,1 Mo produirait une page d'erreur brute du
; serveur, en anglais, sans retour au formulaire. En le laissant passer, c'est
; Laravel qui répond — en français, sous le champ, avec la saisie conservée.
;
; Mais pas 12 Mo non plus : téléverser 12 Mo depuis une connexion mobile pour
; se voir refusé à l'arrivée est une attente inutile. 8 Mo laisse la marge
; sans gaspiller.
upload_max_filesize   = 8M
post_max_size         = 10M
max_file_uploads      = 5

; --- Mémoire et durée ----------------------------------------------------------
; 256 Mo : la génération d'un PDF par dompdf et le redimensionnement d'une
; photo en GD chargent l'image entière en mémoire.
memory_limit          = 256M
max_execution_time    = 120

; --- OPcache -------------------------------------------------------------------
; Le gain le plus important de tous ces réglages. Sans lui, PHP relit et
; recompile chaque fichier du framework à CHAQUE requête.
opcache.enable                  = 1
opcache.memory_consumption      = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files   = 20000

; ZÉRO VÉRIFICATION DES FICHIERS. Dans un conteneur, le code ne change jamais
; en cours d'exécution : un nouveau code signifie une nouvelle image, donc un
; nouveau conteneur. Vérifier les dates de modification serait un coût pur.
opcache.validate_timestamps     = 0

; --- Sessions -------------------------------------------------------------------
; SESSION_DRIVER=database est imposé côté Laravel : le disque du conteneur
; disparaît à chaque déploiement, et déconnecterait tout le monde.
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1

; --- Fuseau ---------------------------------------------------------------------
; UTC en base, toujours. L'affichage en heure locale est du ressort de
; l'application, jamais du stockage.
date.timezone         = UTC
