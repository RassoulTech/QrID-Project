# =============================================================================
# QrID — intégration continue
#
# CE FICHIER REMPLACE DOCKER DESKTOP.
#
# L'image n'étant jamais construite en local, une erreur dans le Dockerfile ne
# se verrait qu'après un déploiement Render — deux à cinq minutes d'attente,
# et une production potentiellement cassée entre-temps.
#
# Ici, GitHub construit l'image à chaque poussée, SANS RIEN DÉPLOYER. Si la
# construction échoue, on le sait en quelques minutes et la production n'a pas
# bougé d'un octet.
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # 1. LES TESTS — d'abord, parce qu'ils sont rapides
  # ---------------------------------------------------------------------------
  tests:
    name: Tests et style
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # LES MÊMES EXTENSIONS QUE L'IMAGE DE PRODUCTION. Un écart ici
          # rendrait les tests menteurs : ils passeraient sur une machine qui
          # ne ressemble pas à celle qui sert les pages.
          extensions: gd, pdo_sqlite, bcmath, exif, zip, mbstring
          coverage: none

      - name: Cache des dépendances Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist

      - name: Préparer l'environnement de test
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Style du code
        run: vendor/bin/pint --test

      # Les tests tournent sur SQLite en mémoire (voir phpunit.xml).
      # C'est un choix assumé : 289 tests en 90 secondes, aucune base à
      # provisionner. Sa limite est connue et documentée — SQLite accepte des
      # formes SQL que MySQL accepte aussi, mais les deux moteurs ne sont pas
      # identiques. Voir docs/DEPLOIEMENT.md, chapitre 4 bis.
      - name: Suite de tests
        run: php artisan test

  # ---------------------------------------------------------------------------
  # 2. L'IMAGE — seulement si les tests passent
  # ---------------------------------------------------------------------------
  image:
    name: Construction de l'image Docker
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - uses: actions/checkout@v4

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v3

      # `push: false` — LE POINT ESSENTIEL. On vérifie que la recette tient
      # debout ; on ne publie rien et on ne déploie rien. Render reste seul
      # maître du déploiement, déclenché par la poussée sur main.
      - name: Construire (sans publier)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # Le cache de GitHub Actions évite de réinstaller Alpine, les
          # extensions PHP et npm à chaque commit. Sans lui, chaque
          # vérification prendrait plusieurs minutes.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Résultat
        run: |
          echo "L'image se construit. Render pourra la produire à l'identique."
          echo "Aucun déploiement n'a été déclenché par cette étape."
