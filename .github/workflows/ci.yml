# =============================================================================
# QrID — intégration continue
#
# CE FICHIER REMPLACE DOCKER DESKTOP.
#
# L'image n'étant jamais construite en local, une erreur dans le Dockerfile ne
# se verrait qu'après un déploiement Render — deux à cinq minutes d'attente,
# et une production potentiellement cassée entre-temps.
#
# Ici, GitHub construit l'image à chaque poussée, SANS RIEN DÉPLOYER. Si la
# construction échoue, on le sait en quelques minutes et la production n'a pas
# bougé d'un octet.
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # 1. LES TESTS — d'abord, parce qu'ils sont rapides
  # ---------------------------------------------------------------------------
  tests:
    name: Tests et style
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # LES MÊMES EXTENSIONS QUE L'IMAGE DE PRODUCTION. Un écart ici
          # rendrait les tests menteurs : ils passeraient sur une machine qui
          # ne ressemble pas à celle qui sert les pages.
          extensions: gd, pdo_sqlite, bcmath, exif, zip, mbstring
          coverage: none

      - name: Cache des dépendances Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist

      - name: Préparer l'environnement de test
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Style du code
        run: vendor/bin/pint --test

      # Les tests tournent sur SQLite en mémoire (voir phpunit.xml).
      # C'est un choix assumé : 289 tests en 90 secondes, aucune base à
      # provisionner. Sa limite est connue et documentée — SQLite accepte des
      # formes SQL que MySQL accepte aussi, mais les deux moteurs ne sont pas
      # identiques. Voir docs/DEPLOIEMENT.md, chapitre 4 bis.
      - name: Suite de tests
        run: php artisan test

  # ---------------------------------------------------------------------------
  # 1 bis. LES MÊMES TESTS, SUR POSTGRESQL — le moteur de Neon
  # ---------------------------------------------------------------------------
  # SQLite accepte ce que PostgreSQL refuse : SUM(type = ?), un texte binaire
  # dans une colonne bytea, un identifiant « abc » comparé à un entier. Il
  # trouve aussi ce que PostgreSQL ne trouve plus — « seck » pour « Seck ».
  # Une suite qui ne tourne que sur SQLite passerait au vert sur un code qui
  # casse en production. Celle-ci tourne sur la version que Neon sert.
  tests-postgresql:
    name: Tests sur PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: qrid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: qrid_test
      DB_USERNAME: postgres
      DB_PASSWORD: test

    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_pgsql, bcmath, exif, zip, mbstring
          coverage: none

      - name: Cache des dépendances Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist

      - name: Préparer l'environnement de test
        run: |
          cp .env.example .env
          php artisan key:generate

      # Les variables DB_* du job l'emportent sur celles de phpunit.xml :
      # PHPUnit ne remplace pas une variable déjà définie.
      - name: Suite de tests
        run: php artisan test

  # ---------------------------------------------------------------------------
  # 2. L'IMAGE — seulement si les tests passent
  # ---------------------------------------------------------------------------
  image:
    name: Construction de l'image Docker
    runs-on: ubuntu-latest
    needs: [tests, tests-postgresql]

    steps:
      - uses: actions/checkout@v4

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v3

      # `push: false` — LE POINT ESSENTIEL. On vérifie que la recette tient
      # debout ; on ne publie rien et on ne déploie rien. Render reste seul
      # maître du déploiement, déclenché par la poussée sur main.
      - name: Construire (sans publier)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # Le cache de GitHub Actions évite de réinstaller Alpine, les
          # extensions PHP et npm à chaque commit. Sans lui, chaque
          # vérification prendrait plusieurs minutes.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Résultat
        run: |
          echo "L'image se construit. Render pourra la produire à l'identique."
          echo "Aucun déploiement n'a été déclenché par cette étape."
