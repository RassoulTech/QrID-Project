; ---------------------------------------------------------------------------
; Worker de file d'attente — Identité Pro
; À déposer dans /etc/supervisor/conf.d/identitepro-worker.conf
; Adapter : chemin du projet, utilisateur système, nombre de process.
; ---------------------------------------------------------------------------

[program:identitepro-worker]
process_name=%(program_name)s_%(process_num)02d
; La file « mail » est traitée en priorité, puis « default ».
command=php /var/www/identite-pro/artisan queue:work database --queue=mail,default --tries=3 --backoff=10 --max-time=3600 --sleep=3 --timeout=60
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/identite-pro/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stopwaitsecs=3600

; ---------------------------------------------------------------------------
; Planificateur Laravel (purge, monitoring de file, relances d'abonnement…)
; Alternative au cron si tu préfères tout gérer via supervisor.
; ---------------------------------------------------------------------------

[program:identitepro-scheduler]
process_name=%(program_name)s
command=php /var/www/identite-pro/artisan schedule:work
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/identite-pro/storage/logs/scheduler.log
